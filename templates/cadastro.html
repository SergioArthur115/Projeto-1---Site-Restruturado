<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senac Tech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>

<body>
    {% include 'partials/header.html' %}
    <main>
        <section>
            <div>
                <h2>Criar sua conta</h2>
                <form method="POST" action="{{ url_for('auth.cadastro') }}" enctype="multipart/form-data">
                    <div class="cadastro_campo" id="campo_nome">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>
                    <div class="cadastro_campo" id="campo_sobrenome">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
                    </div>
                    <div class="cadastro_campo" id="campo_data_nasc">
                        <label for="data_nasc">Data de nascimento</label>
                        <input type="date" id="data_nasc" name="data_nasc" required>
                    </div>
                    <div class="cadastro_campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="cadastro_campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                    </div>
                    <div class="cadastro_campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                    </div>
                    <div class="cadastro_campo">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Rua / Av.">
                    </div>
                    <div class="cadastro_campo" id="campo_numero">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero">
                    </div>
                    <div class="cadastro_campo" id="campo_bairro">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro">
                    </div>
                    <div class="cadastro_campo" id="campo_cidade">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade">
                    </div>
                    <div class="cadastro_campo" id="campo_estado">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" name="estado">
                    </div>
                    <div class="cadastro_campo">
                        <label for="foto">Foto de perfil</label>
                        <input type="file" id="foto" name="foto" accept="image/*">
                    </div>
                    <div class="cadastro_campo">
                        <label for="obs">Observações</label>
                        <textarea id="obs" name="observacoes" rows="4" cols="50"></textarea>
                    </div>
                    <button type="submit" class="btn_cadastrar" id="btn-cadastrar">
                        Criar conta
                    </button>
                    <div class="cadastro_login">
                        <p>Já tem uma conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>
    {% include 'partials/footer.html' %}
</body>

</html>
