<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senac Tech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/body.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menu.css') }}">
</head>

<body>
    {% include 'partials/header.html' %}
    <main>
        <section>
            <div>
                <h2>Criar sua conta</h2>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="cadastro_campo" id="campo_nome">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>
                    <div class="cadastro_campo" id="campo_sobrenome">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
                    </div>
                    <div class="cadastro_campo" id="campo_data_nasc">
                        <label for="data_nasc">Data de nascimento</label>
                        <input type="date" id="data_nasc" name="data_nasc" required>
                    </div>
                    <div class="cadastro_campo" id="campo_cpf">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"
                            autocomplete="off" required>
                    </div>
                    <div class="cadastro_campo" id="campo_rg">
                        <label for="cpf">RG</label>
                        <input type="text" id="rg" name="rg" placeholder="000.000.000-00" maxlength="14"
                            autocomplete="off" required>
                    </div>
                    <div class="cadastro_campo" id="campo_email">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email"
                            required>
                    </div>
                    <div class="cadastro_campo" id="campo_telefone">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15"
                            autocomplete="off" required>
                    </div>
                    <div class="cadastro_campo" id="campo_senha">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres"
                            autocomplete="new-password" required>
                    </div>
                    <div class="cadastro_campo" id="campo_endereco">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereco" required>
                    </div>
                    <div class="cadastro_campo" id="campo_numero">
                        <label for="numero">Numero</label>
                        <input type="text" id="numero" name="numero" required>
                    </div>
                    <div class="cadastro_campo" id="campo_bairro">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" placeholder="Digite seu bairro" required>
                    </div>
                    <div class="cadastro_campo" id="campo_cidade">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>
                    </div>
                    <div class="cadastro_campo" id="campo_estado">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" name="estado" placeholder="Digite seu estado" required>
                    </div>
                    <div class="cadastro_campo">
                        <label for="foto">Foto de perfil</label>
                        <input type="file" id="foto" name="foto" accept="image/*">
                    </div>
                    <div class="cadastro_campo" id="campo_obs">
                        <label for="obs">Observação</label>
                        <textarea name="obs" id="obs"></textarea>
                    </div>
                    <button type="submit" class="btn_cadastrar" id="btn-cadastrar">
                        Criar conta
                    </button>
                    <div class="cadastro_login">
                        <p>Já tem uma conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>
    {% include 'partials/footer.html' %}
</body>

</html>
