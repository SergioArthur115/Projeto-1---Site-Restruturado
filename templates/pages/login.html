<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senac Tech</title>
</head>

<body>
    {% include 'partials/header.html' %}
    <main>
        <section>
            <div>
                <h2>Entrar na sua conta</h2>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="login_campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="username"
                            required>
                    </div>
                    <div class="login_campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                            autocomplete="current-password" required>
                    </div>
                    <div class="login_acoes">
                        <button type="submit" class="btn_entrar">Entrar</button>
                    </div>
                    <div class="login_cadastro">
                        <p>Não tem uma conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>
    {% include 'partials/footer.html' %}
</body>

</html>
