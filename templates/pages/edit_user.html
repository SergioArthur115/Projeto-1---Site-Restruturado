<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senac Tech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/body.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menu.css') }}">
</head>

<body>
    {% include 'partials/header.html' %}
    <main>
        <section>
            <div>
                <h2>Editar Usuário</h2>
                <img src="/static/uploads/{{user.foto}}" width="120">
            </div>
            <div>
                <form method="POST" enctype="multipart/form-data">
                    <label>Nome:</label>
                    <input type="text" name="nome" value="{{user.nome}}" required>
                    <label>Sobrenome:</label>
                    <input type="text" name="sobrenome" value="{{user.sobrenome}}" required>
                    <label>Email:</label>
                    <input type="email" name="email" value="{{user.email}}" required>
                    <label>Foto:</label>
                    <input type="file" name="foto">

                    <button type="submit">Salvar</button>

                </form>
                <form method="POST" enctype="multipart/form-data">
                    <div class="cadastro_campo" id="campo_nome">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" value="{{user.nome}}" required>
                    </div>
                    <div class="cadastro_campo" id="campo_sobrenome">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" value="{{user.sobrenome}}" required>
                    </div>
                    <div class="cadastro_campo" id="campo_data_nasc">
                        <label for="data_nasc">Data de nascimento</label>
                        <input type="date" id="data_nasc" name="data_nasc" value="{{user.data_nasc}}" required>
                    </div>
                    <div class="cadastro_campo" id="campo_cpf">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" value="{{user.cpf}}" maxlength="14" autocomplete="off"
                            required>
                    </div>
                    <div class="cadastro_campo" id="campo_rg">
                        <label for="cpf">RG</label>
                        <input type="text" id="rg" name="rg" value="{{user.rg}}" maxlength="14" autocomplete="off"
                            required>
                    </div>
                    <div class="cadastro_campo" id="campo_email">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" value="{{user.email}}" autocomplete="email"
                            required>
                    </div>
                    <div class="cadastro_campo" id="campo_telefone">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" value="{{user.telefone}}" maxlength="15"
                            autocomplete="off" required>
                    </div>
                    <div class="cadastro_campo" id="campo_endereco">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco" value="{{user.endereco}}" required>
                    </div>
                    <div class="cadastro_campo" id="campo_numero">
                        <label for="numero">Numero</label>
                        <input type="text" id="numero" name="numero" value="{{user.numero}}" required>
                    </div>
                    <div class="cadastro_campo" id="campo_bairro">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" value="{{user.bairro}}" required>
                    </div>
                    <div class="cadastro_campo" id="campo_cidade">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" value="{{user.cidade}}" required>
                    </div>
                    <div class="cadastro_campo" id="campo_estado">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" name="estado" value="{{user.estado}}" required>
                    </div>
                    <div class="cadastro_campo">
                        <label for="foto">Foto de perfil</label>
                        <input type="file" id="foto" name="foto" accept="image/*">
                    </div>
                    <div class="cadastro_campo" id="campo_obs">
                        <label for="obs">Observação</label>
                        <textarea name="obs" id="obs"></textarea>
                    </div>
                    <button type="submit">Salvar</button>
                </form>
            </div>
            <div>
                <a href="/admin">
                    <button>Voltar</button>
                </a>
            </div>
        </section>
    </main>
    {% include 'partials/footer.html' %}

</body>

</html>
